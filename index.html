<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bytez</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'JetBrains Mono', monospace;
        color: #fff;
      }

      #bgcanvas {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0px, rgba(0, 0, 0, 0.12) 1px, transparent 1px, transparent 3px);
        opacity: 0.35;
      }

      /* ---------- GATE ---------- */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.5s ease, filter 0.5s ease;
      }

      #gate.hidden {
        opacity: 0;
        filter: blur(15px);
        pointer-events: none;
      }

      #enterBtn {
        background: none;
        border: none;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        font-size: clamp(16px, 2.4vw, 20px);
        letter-spacing: 0.15em;
        text-transform: lowercase;
        color: #ffe000;
        cursor: pointer;
        text-shadow:
          0 0 3px #ffe000,
          0 0 12px rgba(255, 224, 0, 0.55),
          0 0 26px rgba(255, 224, 0, 0.25);
        animation: neonFlicker 4s infinite;
      }

      #enterBtn:hover {
        text-shadow:
          0 0 6px #fff,
          0 0 24px #ffe000,
          0 0 60px rgba(255, 224, 0, 0.8);
      }

      #enterBtn:focus-visible {
        outline: 1px dashed #ffe000;
        outline-offset: 10px;
      }

      @keyframes neonFlicker {

        0%,
        4%,
        6%,
        84%,
        100% {
          opacity: 1;
        }

        5% {
          opacity: 0.4;
        }

        85% {
          opacity: 0.7;
        }

        86% {
          opacity: 1;
        }
      }

      /* ---------- MAIN ---------- */
      main {
        position: relative;
        z-index: 10;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.8s ease 0.1s;
        padding: 24px 24px 74px;
      }

      main.show {
        opacity: 1;
      }

      .content {
        width: 100%;
        max-width: 420px;
        text-align: left;
      }

      .pfp-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 8px;
      }

      .uname-wrapper {
        display: flex;
        flex-direction: column;
      }

      .pfp {
        width: clamp(64px, 15vw, 96px);
        height: clamp(64px, 15vw, 96px);
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #2a2500;
        box-shadow:
          0 0 15px rgba(255, 224, 0, 0.15),
          0 0 30px rgba(255, 224, 0, 0.08);
        transition: box-shadow 0.3s ease;
        flex-shrink: 0;
        order: 2;
      }

      .pfp:hover {
        box-shadow:
          0 0 20px rgba(255, 224, 0, 0.25),
          0 0 40px rgba(255, 224, 0, 0.12);
      }

      .uname {
        font-size: clamp(46px, 11vw, 64px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 0.95;
        color: #fff;
      }

      .uname .y {
        color: #ffe000;
        text-shadow: 0 0 20px rgba(255, 224, 0, 0.55);
      }

      .utag {
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #6b6220;
        margin-top: 8px;
        margin-bottom: 26px;
      }

      .utag::before {
        content: "— ";
      }

      .typeline {
        font-size: 14px;
        color: #b8b8b8;
        line-height: 1.5;
        height: 21px;
        margin-bottom: 28px;
        border-left: 2px solid #2a2500;
        padding-left: 14px;
        white-space: nowrap;
        overflow: hidden;
      }

      .typeline .cursor {
        display: inline-block;
        width: 8px;
        height: 14px;
        background: #ffe000;
        margin-left: 2px;
        animation: blink 0.9s steps(2) infinite;
        vertical-align: middle;
        box-shadow: 0 0 8px #ffe000;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .section-tag {
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #524a17;
        margin-bottom: 10px;
        margin-top: 22px;
      }

      .links {
        display: flex;
        flex-direction: column;
      }

      .linkbtn {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #e8e8e8;
        font-size: 15px;
        font-weight: 700;
        padding: 9px 0;
        border-bottom: 1px solid #161611;
        position: relative;
        transition: color 0.15s ease, padding-left 0.15s ease, border-color 0.15s ease;
      }

      .linkbtn:hover {
        color: #ffe000;
        padding-left: 8px;
        border-color: #2a2500;
      }

      .linkbtn:hover .link-arrow {
        opacity: 1;
        transform: translateX(0);
      }

      .linkbtn:focus-visible {
        outline: 1px dashed #ffe000;
        outline-offset: 4px;
      }

      .link-dot {
        width: 5px;
        height: 5px;
        background: #ffe000;
        box-shadow: 0 0 6px #ffe000;
        flex-shrink: 0;
      }

      .link-url {
        font-size: 11px;
        color: #555;
        font-weight: 400;
        margin-left: auto;
      }

      .link-arrow {
        color: #ffe000;
        font-size: 13px;
        opacity: 0;
        transform: translateX(-4px);
        transition: all 0.15s ease;
      }

      .priv-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 700;
        color: #666;
        padding: 9px 0;
        border-bottom: 1px solid #161611;
      }

      .priv-row .link-dot {
        background: #3a3a3a;
        box-shadow: none;
      }

      .priv-desc {
        font-size: 11px;
        color: #4a4a4a;
        font-weight: 400;
        margin-left: auto;
      }

      #muteBtn {
        position: fixed;
        bottom: 76px;
        right: 20px;
        z-index: 50;
        background: none;
        border: none;
        color: #4a4318;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 6px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease, color 0.2s ease;
      }

      #muteBtn.show {
        opacity: 1;
      }

      #muteBtn:hover {
        color: #ffe000;
      }

      #muteBtn:focus-visible {
        outline: 1px dashed #ffe000;
        outline-offset: 3px;
      }

      #visualizer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 64px;
        z-index: 5;
        display: flex;
        align-items: flex-end;
        justify-content: stretch;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      #visualizer.show {
        opacity: 1;
      }

      #visualizer .bar {
        flex: 1 1 0;
        height: 1px;
        background: #ffe000;
        transition: height 0.06s linear;
        opacity: 0.6;
        margin: 0 0.5px;
      }

      .side-gif {
        position: fixed;
        top: 50%;
        z-index: 4;
        max-height: 70vh;
        width: auto;
        opacity: 0;
        filter: drop-shadow(0 0 20px rgba(255, 224, 0, 0.15));
        transition: opacity 0.8s ease 0.3s;
        pointer-events: none;
      }

      .side-gif.show {
        opacity: 0.85;
      }

      #gifLeft {
        left: 48px;
        transform: translateY(-58%);
      }

      #gifRight {
        right: 48px;
        transform: translateY(-42%);
      }

      @media (max-width:900px) {
        .side-gif {
          display: none;
        }
      }

      @media (max-width:480px) {

        .link-url,
        .priv-desc {
          display: none;
        }
      }

      @media (prefers-reduced-motion:reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bgcanvas"></canvas>
    <div id="gate">
      <button id="enterBtn">click to enter</button>
    </div>
    <audio id="bgm" src="music.mp3" loop preload="none" crossorigin="anonymous"></audio>
    <button id="muteBtn">mute</button>
    <div id="visualizer"></div>
    <main id="main">
      <div class="content">
        <div class="pfp-container">
          <div class="uname-wrapper">
            <div class="uname">B <span class="y">y</span>tez </div>
            <div class="utag">idk what to put here.</div>
          </div>
          <img src="pfp.png" alt="profile" class="pfp">
        </div>
        <div class="typeline" id="typeline">
          <span class="cursor"></span>
        </div>
        <div class="section-tag">public</div>
        <div class="links">
          <a class="linkbtn" href="https://theke.vercel.app/" target="_blank" rel="noopener noreferrer">
            <span class="link-dot"></span>Theke <span class="link-url">theke.vercel.app</span>
            <span class="link-arrow">→</span>
          </a>
          <a class="linkbtn" href="https://bytezdev.itch.io/linuxce" target="_blank" rel="noopener noreferrer">
            <span class="link-dot"></span>LinuxCE <span class="link-url">itch.io</span>
            <span class="link-arrow">→</span>
          </a>
        </div>
        <div class="section-tag">private</div>
        <div class="links">
          <div class="priv-row">
            <span class="link-dot"></span>Lex <span class="priv-desc">mc client</span>
          </div>
          <div class="priv-row">
            <span class="link-dot"></span>McBot <span class="priv-desc">mc automation</span>
          </div>
          <div class="priv-row">
            <span class="link-dot"></span>Brother <span class="priv-desc">linux assistant</span>
          </div>
        </div>
      </div>
    </main>
    <script>
      const canvas = document.getElementById('bgcanvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function initParticles() {
        particles = Array.from({
          length: 60
        }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.3,
          a: Math.random() * 0.45 + 0.1
        }));
      }
      initParticles();

      function animateParticles() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,224,0,${p.a})`;
          ctx.fill();
        }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x,
              dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(255,224,0,${0.06*(1-dist/100)})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();
      const gate = document.getElementById('gate');
      const main = document.getElementById('main');
      const bgm = document.getElementById('bgm');
      const muteBtn = document.getElementById('muteBtn');
      let muted = false;
      gate.addEventListener('click', () => {
        bgm.volume = 0.45;
        bgm.play().then(() => {
          document.getElementById('gifLeft').classList.add('show');
          document.getElementById('gifRight').classList.add('show');
        }).catch(() => {});
        gate.classList.add('hidden');
        main.classList.add('show');
        muteBtn.classList.add('show');
        setTimeout(() => {
          gate.remove();
          startTyping();
        }, 500);
        initVisualizer();
      });
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        muted = !muted;
        bgm.muted = muted;
        muteBtn.textContent = muted ? 'unmute' : 'mute';
      });
      let audioCtx, analyser, freqData, barEls;
      const BAR_COUNT = 120;

      function initVisualizer() {
        if (audioCtx) return;
        const vizEl = document.getElementById('visualizer');
        vizEl.classList.add('show');
        for (let i = 0; i < BAR_COUNT; i++) {
          const b = document.createElement('div');
          b.className = 'bar';
          vizEl.appendChild(b);
        }
        barEls = vizEl.querySelectorAll('.bar');
        try {
          audioCtx = new(window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaElementSource(bgm);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.8;
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          freqData = new Uint8Array(analyser.frequencyBinCount);
          drawBars();
        } catch (err) {
          console.warn('visualizer unavailable:', err);
        }
      }

      function drawBars() {
        requestAnimationFrame(drawBars);
        if (!analyser) return;
        analyser.getByteFrequencyData(freqData);
        for (let i = 0; i < BAR_COUNT; i++) {
          const idx = Math.floor((i / BAR_COUNT) * (freqData.length * 0.75));
          const v = freqData[idx] / 255;
          const h = Math.max(1, v * 64);
          barEls[i].style.height = h + 'px';
        }
      }
      const lines = ["i code random shit.", "i play random shit.", "if i got an idea, i make it.", "idc how."];
      const typeEl = document.getElementById('typeline');

      function startTyping() {
        let li = 0,
          ci = 0;
        const cursor = ' < span class = "cursor" > < /span>';

        function typeChar() {
          if (li >= lines.length) li = 0;
          const line = lines[li];
          if (ci <= line.length) {
            typeEl.innerHTML = line.slice(0, ci) + cursor;
            ci++;
            setTimeout(typeChar, 38);
          } else {
            setTimeout(eraseChar, 1300);
          }
        }

        function eraseChar() {
          const line = lines[li];
          if (ci >= 0) {
            typeEl.innerHTML = line.slice(0, ci) + cursor;
            ci--;
            setTimeout(eraseChar, 22);
          } else {
            li++;
            ci = 0;
            setTimeout(typeChar, 250);
          }
        }
        typeChar();
      }
    </script>
  </body>
</html>
