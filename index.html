<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'JetBrains Mono', monospace;
  color: #fff;
}

@media (hover: none) and (pointer: coarse) {
  html, body {
    cursor: auto;
  }
  #cursor {
    display: none !important;
  }
}

@media (hover: hover) and (pointer: fine) {
  html, body {
    cursor: none;
  }
}

#bgcanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

#rippleCanvas {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(0deg,
      rgba(0, 0, 0, 0.10) 0px,
      rgba(0, 0, 0, 0.10) 1px,
      transparent 1px,
      transparent 3px);
  opacity: 0.3;
}

#cursor {
  position: fixed;
  z-index: 999;
  pointer-events: none;
  width: 12px;
  height: 12px;
  border: 1.5px solid rgba(255, 224, 0, 0.8);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.15s ease, height 0.15s ease, opacity 0.15s ease;
  box-shadow: 0 0 8px rgba(255, 224, 0, 0.4);
  mix-blend-mode: screen;
}

#cursor.big {
  width: 28px;
  height: 28px;
  opacity: 0.5;
}

#gate {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: opacity 0.8s ease, filter 0.8s ease;
}

#gate.hidden {
  opacity: 0;
  filter: blur(20px);
  pointer-events: none;
}

#enterBtn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
  font-size: clamp(14px, 2.2vw, 18px);
  letter-spacing: 0.2em;
  text-transform: lowercase;
  color: #ffe000;
  text-shadow: 0 0 4px #ffe000, 0 0 16px rgba(255, 224, 0, 0.5), 0 0 32px rgba(255, 224, 0, 0.2);
  animation: neonFlicker 4s infinite;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#enterBtn:active {
  text-shadow: 0 0 6px #fff, 0 0 24px #ffe000, 0 0 60px rgba(255, 224, 0, 0.8);
}

@keyframes neonFlicker {
  0%, 4%, 6%, 84%, 100% { opacity: 1; }
  5% { opacity: 0.35; }
  85% { opacity: 0.65; }
  86% { opacity: 1; }
}

main {
  position: relative;
  z-index: 10;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1s ease 0.2s;
  padding: 16px 16px 80px;
  pointer-events: none;
  perspective: 1200px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

main.show {
  opacity: 1;
  pointer-events: all;
}

.layout {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out;
  will-change: transform;
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.content {
  width: 100%;
  max-width: 420px;
  text-align: left;
  position: relative;
  padding: 24px;
  border-radius: 14px;
  border: none;
}

.pfp-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 8px;
  position: relative;
}

.uname-wrapper {
  display: flex;
  flex-direction: column;
}

.pfp {
  width: clamp(64px, 15vw, 96px);
  height: clamp(64px, 15vw, 96px);
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #2a2500;
  box-shadow: 0 0 15px rgba(255, 224, 0, 0.1), 0 0 30px rgba(255, 224, 0, 0.05);
  transition: box-shadow 0.4s ease, transform 0.4s ease;
  flex-shrink: 0;
  order: 2;
}

.pfp.alive {
  box-shadow: 0 0 30px rgba(255, 224, 0, 0.35), 0 0 60px rgba(255, 224, 0, 0.15);
  transform: scale(1.04);
}

.uname {
  font-size: clamp(36px, 10vw, 64px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 0.95;
  color: #fff;
}

.uname .y {
  color: #ffe000;
  text-shadow: 0 0 20px rgba(255, 224, 0, 0.55);
}

.utag {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #6b6220;
  margin-top: 8px;
  margin-bottom: 26px;
}

.utag::before {
  content: "— ";
}

.typeline {
  font-size: 13px;
  color: #b8b8b8;
  line-height: 1.5;
  min-height: 21px;
  margin-bottom: 28px;
  border-left: 2px solid #2a2500;
  padding-left: 14px;
  white-space: nowrap;
  overflow: hidden;
}

.typeline .cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: #ffe000;
  margin-left: 2px;
  animation: blink 0.9s steps(2) infinite;
  vertical-align: middle;
  box-shadow: 0 0 8px #ffe000;
}

@keyframes blink {
  50% { opacity: 0; }
}

.section-tag {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #524a17;
  margin-bottom: 10px;
  margin-top: 22px;
}

.links {
  display: flex;
  flex-direction: column;
}

.linkbtn {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #e8e8e8;
  font-size: 14px;
  font-weight: 700;
  padding: 11px 0;
  border-bottom: 1px solid #161611;
  position: relative;
  transition: color 0.15s ease, padding-left 0.2s ease, border-color 0.2s ease, text-shadow 0.3s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.linkbtn:active {
  color: #ffe000;
  padding-left: 8px;
  border-color: #2a2500;
  text-shadow: 0 0 12px rgba(255, 224, 0, 0.4);
}

.linkbtn:active .link-arrow {
  opacity: 1;
  transform: translateX(0);
}

.linkbtn:active .link-dot {
  box-shadow: 0 0 12px #ffe000;
}

@media (hover: hover) and (pointer: fine) {
  .linkbtn:hover {
    color: #ffe000;
    padding-left: 8px;
    border-color: #2a2500;
    text-shadow: 0 0 12px rgba(255, 224, 0, 0.4);
  }

  .linkbtn:hover .link-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  .linkbtn:hover .link-dot {
    box-shadow: 0 0 12px #ffe000;
  }
}

.linkbtn.waking {
  color: #c8b800;
  padding-left: 4px;
}

.linkbtn.waking .link-dot {
  box-shadow: 0 0 12px #ffe000;
}

.link-dot {
  width: 5px;
  height: 5px;
  background: #ffe000;
  box-shadow: 0 0 6px #ffe000;
  flex-shrink: 0;
  transition: box-shadow 0.3s ease;
}

.link-url {
  font-size: 10px;
  color: #555;
  font-weight: 400;
  margin-left: auto;
  pointer-events: none;
}

.link-arrow {
  color: #ffe000;
  font-size: 13px;
  opacity: 0;
  transform: translateX(-4px);
  transition: all 0.15s ease;
  pointer-events: none;
}

.priv-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #666;
  padding: 11px 0;

}

.priv-row.waking {
  color: #888;
}

.priv-row .link-dot {
  background: #3a3a3a;
  box-shadow: none;
}

.priv-desc {
  font-size: 10px;
  color: #4a4a4a;
  font-weight: 400;
  margin-left: auto;
}

.social-buttons {
  position: absolute;
  bottom: -40px;
  right: 7px;
  display: flex;
  gap: 8px;
}

.social-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 224, 0, 0.2);
  border-radius: 8px;
  color: rgba(255, 224, 0, 0.7);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  position: relative;
  overflow: hidden;
}

.social-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 224, 0, 0.05);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.social-btn:active::before {
  opacity: 1;
}

.social-btn:active {
  border-color: #ffe000;
  box-shadow: 0 0 20px rgba(255, 224, 0, 0.2);
  transform: translateY(-1px);
  color: #ffe000;
}

@media (hover: hover) and (pointer: fine) {
  .social-btn:hover::before {
    opacity: 1;
  }
  
  .social-btn:hover {
    border-color: #ffe000;
    box-shadow: 0 0 20px rgba(255, 224, 0, 0.2);
    transform: translateY(-1px);
    color: #ffe000;
  }
}

.social-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.side-panel {
  flex-shrink: 0;
  width: 100%;
  height: 40px;
  border-radius: 12px;
  border: none;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  transition: opacity 0.6s ease;
  opacity: 0;
  pointer-events: none;
}

.side-panel.show {
  opacity: 1;
  pointer-events: all;
}

.side-divider {
  width: 1px;
  height: 16px;
  background: rgba(255, 224, 0, 0.2);
}

#views {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #4a4318;
  white-space: nowrap;

#muteBtn {

  border: none;
  color: #4a4318;

  font-size: 9px;
  letter-spacing: 0.15em;

  white-space: nowrap;
  padding: 8px;

}

#muteBtn:active {
  color: #ffe000;
}

@media (hover: hover) and (pointer: fine) {

    color: #ffe000;

}

#visualizer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 64px;
  z-index: 5;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}

#visualizer.show {
  opacity: 1;
}

#visualizer .bar {
  flex: 1 1 0;
  height: 1px;
  background: #ffe000;
  opacity: 0.5;
  margin: 0 0.5px;
}

@media (max-width: 768px) {
  main {

    width: 36px;
    height: 36px;
  }

  .social-btn svg {
    width: 18px;

  }

  .social-buttons {
    bottom: -40px;

    gap: 8px;
  }

  .side-panel {
    height: 40px;
    padding: 0 16px;
  }

  #visualizer {
    height: 64px;
  }
}

@media (max-width: 480px) {
  main {
    padding: 16px 12px 80px;

  .content {
    padding: 16px;
  }

  .pfp-container {
    gap: 12px;
  }

  .pfp {
    width: 56px;
    height: 56px;
  }

  .uname {
    font-size: 36px;
  }

  .utag {
    font-size: 9px;

  }

  .typeline {
    font-size: 12px;

  }

  .section-tag {

    margin-top: 18px;

  }

  .linkbtn, .priv-row {
    font-size: 13px;

  .link-url, .priv-desc {
    font-size: 9px;
  }

  .social-btn {
    width: 32px;

  }

  .social-btn svg {
    width: 16px;
    height: 16px;
  }

  .social-buttons {
    bottom: -36px;
    right: 5px;
    gap: 6px;
  }

  .side-panel {
    height: 40px;
    padding: 0 12px;
  }

  #visualizer {
    height: 56px;
  }
}

@media (max-width: 380px) {
  .content {
    padding: 14px 12px;
  }

  .pfp {
    width: 48px;
    height: 48px;
  }

  .uname {
    font-size: 30px;
  }

  .utag {
    font-size: 8px;
    margin-bottom: 18px;
  }

  .typeline {
    font-size: 11px;
    margin-bottom: 20px;
  }

  .linkbtn, .priv-row {
    font-size: 12px;
    padding: 9px 0;
  }

  .link-url, .priv-desc {
    font-size: 8px;
  }
  
  .social-btn {
    width: 30px;
    height: 30px;
  }
  
  .social-btn svg {
    width: 14px;
    height: 14px;
  }

  .social-buttons {
    bottom: -32px;
    right: 4px;
    gap: 5px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) ||
                 ('ontouchstart' in window && window.innerWidth < 768);

const cursorEl = document.getElementById('cursor');
let mx = -999, my = -999;

if (!isMobile) {
  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    cursorEl.style.left = mx + 'px';
    cursorEl.style.top = my + 'px';
  });

  document.querySelectorAll('a,button').forEach(el => {
    el.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
    el.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
  });
} else {
  cursorEl.style.display = 'none';
}

document.addEventListener('touchmove', e => {
  if (e.touches.length > 0) {
    mx = e.touches[0].clientX;
    my = e.touches[0].clientY;

    if (Math.random() < 0.08) spawnRipple(mx, my);

    if (Math.random() < 0.3) {
      inkTrail.push({
        x: mx + (Math.random() - 0.5) * 4,
        y: my + (Math.random() - 0.5) * 4,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8 - 0.2,
        a: Math.min(0.7, 0.5),
        r: Math.random() * 2.5 + 0.5,
        life: 1
      });
    }
  }
}, { passive: true });

document.addEventListener('touchstart', e => {
  if (e.touches.length > 0) {
    mx = e.touches[0].clientX;
    my = e.touches[0].clientY;

    const target = e.target;
    if (target.closest('a.linkbtn') || target.closest('a.social-btn')) return;

    spawnRipple(mx, my);

    for (let i = 0; i < 8; i++) {
      inkTrail.push({
        x: mx,
        y: my,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3 - 0.5,
        a: 0.6,
        r: Math.random() * 3 + 1,
        life: 1
      });
    }
  }
}, { passive: true });

const bgC = document.getElementById('bgcanvas');
const bgX = bgC.getContext('2d');
let W, H;

function resize() {
  W = bgC.width = window.innerWidth;
  H = bgC.height = window.innerHeight;
}

resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => {
  setTimeout(resize, 100);
});

function noise2(x, y, t) {
  return (
    Math.sin(x * 0.008 + t * 0.3) *
    Math.cos(y * 0.011 + t * 0.2) +
    Math.sin(x * 0.015 - y * 0.009 + t * 0.15)
  ) * 0.5;
}

const PARTICLE_COUNT = isMobile ? 50 : 90;
let bgParticles = [];

function makeParticle() {
  return {
    x: Math.random() * (W || window.innerWidth),
    y: Math.random() * (H || window.innerHeight),
    vx: 0,
    vy: 0,
    maxLife: 200 + Math.random() * 400,
    age: 0,
    size: Math.random() * 1.4 + 0.3,
    hue: 42 + (Math.random() - 0.5) * 18
  };
}

for (let i = 0; i < PARTICLE_COUNT; i++) bgParticles.push(makeParticle());

let ripples = [];

function spawnRipple(x, y) {
  ripples.push({ x, y, r: 0, maxR: 60 + Math.random() * 50, a: 0.4, speed: 1.5 + Math.random() });
}

let inkTrail = [];

const ripC = document.getElementById('rippleCanvas');
const ripX = ripC.getContext('2d');

function resizeRip() {
  ripC.width = window.innerWidth;
  ripC.height = window.innerHeight;
}

resizeRip();
window.addEventListener('resize', resizeRip);

let bgT = 0;
let audioEnergy = 0;
let animating = false;
let lastTime = 0;

function mainLoop(ts) {
  requestAnimationFrame(mainLoop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (!animating) return;

  bgT += dt;

  bgX.fillStyle = 'rgba(0,0,0,0.18)';
  bgX.fillRect(0, 0, W, H);

  for (let i = 0; i < (isMobile ? 3 : 5); i++) {
    const sx = Math.random() * W;
    const sy = Math.random() * H;
    const angle = noise2(sx, sy, bgT) * Math.PI * 2;
    bgX.beginPath();
    bgX.moveTo(sx, sy);
    bgX.lineTo(sx + Math.cos(angle) * 12, sy + Math.sin(angle) * 12);
    bgX.strokeStyle = 'rgba(255,224,0,0.015)';
    bgX.lineWidth = 1;
    bgX.stroke();
  }

  for (let p of bgParticles) {
    const angle = noise2(p.x, p.y, bgT) * Math.PI * 2;
    const speed = 0.4 + audioEnergy * 0.8;

    const cdx = p.x - mx, cdy = p.y - my;
    const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
    let cx = 0, cy = 0;
    if (cdist < 150 && cdist > 1) {
      cx = (cdx / cdist) * (150 - cdist) * 0.006;
      cy = (cdy / cdist) * (150 - cdist) * 0.006;
    }

    p.vx = p.vx * 0.85 + (Math.cos(angle) * speed * 0.15 + cx);
    p.vy = p.vy * 0.85 + (Math.sin(angle) * speed * 0.15 + cy);
    p.x += p.vx;
    p.y += p.vy;
    p.age++;

    if (p.x < -5) p.x = W + 5;
    if (p.x > W + 5) p.x = -5;
    if (p.y < -5) p.y = H + 5;
    if (p.y > H + 5) p.y = -5;

    const life = 1 - (p.age / p.maxLife);
    if (life < 0) {
      Object.assign(p, makeParticle());
      continue;
    }

    const pulse = 1 + audioEnergy * 0.6;
    bgX.beginPath();
    bgX.arc(p.x, p.y, p.size * pulse, 0, Math.PI * 2);
    bgX.fillStyle = `hsla(${p.hue},100%,60%,${0.35 * life})`;
    bgX.fill();
  }

  for (let i = 0; i < bgParticles.length; i++) {
    for (let j = i + 1; j < bgParticles.length; j++) {
      const dx = bgParticles[i].x - bgParticles[j].x,
            dy = bgParticles[i].y - bgParticles[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 110) {
        bgX.beginPath();
        bgX.moveTo(bgParticles[i].x, bgParticles[i].y);
        bgX.lineTo(bgParticles[j].x, bgParticles[j].y);
        bgX.strokeStyle = `rgba(255,224,0,${0.07 * (1 - d / 110) * (1 + audioEnergy)})`;
        bgX.lineWidth = 0.8;
        bgX.stroke();
      }
    }
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += rp.speed;
    rp.a -= 0.012;
    if (rp.a <= 0) {
      ripples.splice(i, 1);
      continue;
    }
    bgX.beginPath();
    bgX.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    bgX.strokeStyle = `rgba(255,224,0,${rp.a})`;
    bgX.lineWidth = 0.8;
    bgX.stroke();
  }

  ripX.clearRect(0, 0, ripC.width, ripC.height);
  for (let i = inkTrail.length - 1; i >= 0; i--) {
    const ink = inkTrail[i];
    ink.x += ink.vx;
    ink.y += ink.vy;
    ink.life -= 0.022;
    if (ink.life <= 0) {
      inkTrail.splice(i, 1);
      continue;
    }
    ripX.beginPath();
    ripX.arc(ink.x, ink.y, ink.r, 0, Math.PI * 2);
    ripX.fillStyle = `rgba(255,224,0,${ink.a * ink.life})`;
    ripX.fill();
  }

  proximityCheck();
}

requestAnimationFrame(ts => {
  lastTime = ts;
  requestAnimationFrame(mainLoop);
});

function proximityCheck() {
  const pfp = document.getElementById('pfpImg');
  if (pfp) {
    const r = pfp.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
    pfp.classList.toggle('alive', d < 140);
  }
}

const gate = document.getElementById('gate');
const mainEl = document.getElementById('main');
const bgm = document.getElementById('bgm');
const muteBtn = document.getElementById('muteBtn');
const sidePanel = document.getElementById('sidePanel');
let muted = false;

function enterSite() {
  bgm.volume = 0.4;

  const playPromise = bgm.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      document.addEventListener('touchstart', function playOnTouch() {
        bgm.play().catch(() => {});
        document.removeEventListener('touchstart', playOnTouch);
      }, { once: true });
    });
  }

  gate.classList.add('hidden');
  mainEl.classList.add('show');
  sidePanel.classList.add('show');
  animating = true;
  setTimeout(() => {
    gate.remove();
    startTyping();
  }, 600);
  initVisualizer();
  spawnRipple(mx === -999 ? window.innerWidth / 2 : mx, my === -999 ? window.innerHeight / 2 : my);
}

document.getElementById('enterBtn').addEventListener('click', enterSite);
document.getElementById('enterBtn').addEventListener('touchend', e => {
  e.preventDefault();
  enterSite();
});

muteBtn.addEventListener('click', toggleMute);
muteBtn.addEventListener('touchend', e => {
  e.preventDefault();
  toggleMute();
});

function toggleMute() {
  muted = !muted;
  bgm.muted = muted;
  muteBtn.textContent = muted ? 'unmute' : 'mute';
}

let audioCtx, analyser, freqData, barEls;
const BAR_COUNT = isMobile ? 64 : 120;

function initVisualizer() {
  if (audioCtx) return;
  const vizEl = document.getElementById('visualizer');
  vizEl.classList.add('show');
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    vizEl.appendChild(b);
  }
  barEls = vizEl.querySelectorAll('.bar');
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(bgm);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    drawBars();
  } catch (e) {
    console.warn('audio ctx failed', e);
  }
}

function drawBars() {
  requestAnimationFrame(drawBars);
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let v of freqData) sum += v;
  audioEnergy = (sum / freqData.length) / 128;
  for (let i = 0; i < BAR_COUNT; i++) {
    const idx = Math.floor((i / BAR_COUNT) * freqData.length * 0.75);
    const v = freqData[idx] / 255;
    barEls[i].style.height = Math.max(1, v * 64) + 'px';
  }
}

const lines = [
  "i code random shit.",
  "i play random games.",
  "guns.lol? lmao.",
  "i build my ideas.",
  "idc how."
];
const typeEl = document.getElementById('typeline');

function startTyping() {
  let li = 0, ci = 0;
  const cursor = '<span class="cursor"></span>';

  function typeChar() {
    if (li >= lines.length) li = 0;
    const line = lines[li];
    if (ci <= line.length) {
      typeEl.innerHTML = line.slice(0, ci) + cursor;
      ci++;
      setTimeout(typeChar, 38);
    } else {
      setTimeout(eraseChar, 1400);
    }
  }

  function eraseChar() {
    const line = lines[li];
    if (ci >= 0) {
      typeEl.innerHTML = line.slice(0, ci) + cursor;
      ci--;
      setTimeout(eraseChar, 22);
    } else {
      li++;
      ci = 0;
      setTimeout(typeChar, 260);
    }
  }

  typeChar();
}

function updateViewCounter() {
  const viewsEl = document.getElementById('views');
  const BASE = 'https://countapi.mileshilliard.com/api/v1';
  const KEY = 'bytez';
  const VISITED_KEY = 'bytez_visit';

  const hasVisited = localStorage.getItem(VISITED_KEY);

  if (hasVisited) {
    fetch(`${BASE}/get/${KEY}`)
      .then(r => r.json())
      .then(d => {
        viewsEl.textContent = d.value + ' visits';
        viewsEl.style.opacity = '1';
      })
      .catch(() => {
        viewsEl.textContent = '—';
        viewsEl.style.opacity = '1';
      });
  } else {
    fetch(`${BASE}/hit/${KEY}`)
      .then(r => r.json())
      .then(d => {
        localStorage.setItem(VISITED_KEY, 'true');
        viewsEl.textContent = d.value + ' visits';
        viewsEl.style.opacity = '1';
      })
      .catch(() => {
        viewsEl.textContent = '—';
        viewsEl.style.opacity = '1';
      });
  }
}

updateViewCounter();

if (!isMobile) {
  document.addEventListener('click', e => {
    spawnRipple(e.clientX, e.clientY);
    for (let i = 0; i < 12; i++) {
      inkTrail.push({
        x: e.clientX,
        y: e.clientY,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3 - 0.5,
        a: 0.6,
        r: Math.random() * 3 + 1,
        life: 1
      });
    }
  });
}

const tiltCard = document.getElementById('tiltCard');
const layoutEl = document.querySelector('.layout');
const TILT_MAX = isMobile ? 3 : 6;

if (!isMobile) {
  tiltCard.addEventListener('mousemove', handleTilt);
  tiltCard.addEventListener('mouseleave', resetTilt);
}

function handleTilt(e) {
  const r = layoutEl.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width;
  const py = (e.clientY - r.top) / r.height;
  const rx = (0.5 - py) * TILT_MAX * 2;
  const ry = (px - 0.5) * TILT_MAX * 2;
  layoutEl.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
}

function resetTilt() {
  layoutEl.style.transform = 'rotateX(0deg) rotateY(0deg)';
}
</script>
