<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bytez</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'JetBrains Mono',monospace;
  color:#fff;
  cursor:none;
}

#bgcanvas{position:fixed;inset:0;z-index:0;}
#rippleCanvas{position:fixed;inset:0;z-index:3;pointer-events:none;}

body::after{
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,0.10) 0px,rgba(0,0,0,0.10) 1px,
    transparent 1px,transparent 3px);
  opacity:0.3;
}

#cursor{
  position:fixed;z-index:999;pointer-events:none;
  width:12px;height:12px;
  border:1.5px solid rgba(255,224,0,0.8);
  border-radius:50%;
  transform:translate(-50%,-50%);
  transition:width 0.15s ease,height 0.15s ease,opacity 0.15s ease;
  box-shadow:0 0 8px rgba(255,224,0,0.4);
  mix-blend-mode:screen;
}
#cursor.big{width:28px;height:28px;opacity:0.5;}

#gate{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  cursor:none;
  transition:opacity 0.8s ease,filter 0.8s ease;
}
#gate.hidden{opacity:0;filter:blur(20px);pointer-events:none;}

#enterBtn{
  background:none;border:none;
  font-family:'JetBrains Mono',monospace;
  font-weight:400;font-size:clamp(14px,2.2vw,18px);
  letter-spacing:0.2em;text-transform:lowercase;
  color:#ffe000;cursor:none;
  text-shadow:0 0 4px #ffe000,0 0 16px rgba(255,224,0,0.5),0 0 32px rgba(255,224,0,0.2);
  animation:neonFlicker 4s infinite;
}
#enterBtn:hover{
  text-shadow:0 0 6px #fff,0 0 24px #ffe000,0 0 60px rgba(255,224,0,0.8);
}

@keyframes neonFlicker{
  0%,4%,6%,84%,100%{opacity:1;}
  5%{opacity:0.35;}85%{opacity:0.65;}86%{opacity:1;}
}

main{
  position:relative;z-index:10;height:100vh;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 1s ease 0.2s;
  padding:24px 24px 80px;
  pointer-events:none;
}
main.show{opacity:1;pointer-events:all;}

.content{width:100%;max-width:420px;text-align:left;}

.pfp-container{
  display:flex;align-items:center;
  justify-content:space-between;gap:20px;margin-bottom:8px;
}
.uname-wrapper{display:flex;flex-direction:column;}

.pfp{
  width:clamp(64px,15vw,96px);height:clamp(64px,15vw,96px);
  border-radius:50%;object-fit:cover;
  border:2px solid #2a2500;
  box-shadow:0 0 15px rgba(255,224,0,0.1),0 0 30px rgba(255,224,0,0.05);
  transition:box-shadow 0.4s ease,transform 0.4s ease;
  flex-shrink:0;order:2;
}
.pfp.alive{
  box-shadow:0 0 30px rgba(255,224,0,0.35),0 0 60px rgba(255,224,0,0.15);
  transform:scale(1.04);
}

.uname{
  font-size:clamp(46px,11vw,64px);font-weight:800;
  letter-spacing:-0.02em;line-height:0.95;color:#fff;
}
.uname .y{color:#ffe000;text-shadow:0 0 20px rgba(255,224,0,0.55);}

.utag{
  font-size:11px;letter-spacing:0.3em;text-transform:uppercase;
  color:#6b6220;margin-top:8px;margin-bottom:26px;
}
.utag::before{content:"— ";}

.typeline{
  font-size:14px;color:#b8b8b8;line-height:1.5;
  height:21px;margin-bottom:28px;
  border-left:2px solid #2a2500;padding-left:14px;
  white-space:nowrap;overflow:hidden;
}
.typeline .cursor{
  display:inline-block;width:8px;height:14px;
  background:#ffe000;margin-left:2px;
  animation:blink 0.9s steps(2) infinite;
  vertical-align:middle;box-shadow:0 0 8px #ffe000;
}
@keyframes blink{50%{opacity:0;}}

.section-tag{
  font-size:10px;letter-spacing:0.3em;text-transform:uppercase;
  color:#524a17;margin-bottom:10px;margin-top:22px;
}

.links{display:flex;flex-direction:column;}
.linkbtn{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:#e8e8e8;font-size:15px;font-weight:700;
  padding:9px 0;border-bottom:1px solid #161611;
  position:relative;
  transition:color 0.15s ease,padding-left 0.2s ease,
             border-color 0.2s ease,text-shadow 0.3s ease;
}
.linkbtn:hover{
  color:#ffe000;padding-left:8px;border-color:#2a2500;
  text-shadow:0 0 12px rgba(255,224,0,0.4);
}
.linkbtn:hover .link-arrow{opacity:1;transform:translateX(0);}
.linkbtn.waking{color:#c8b800;padding-left:4px;}
.linkbtn.waking .link-dot{box-shadow:0 0 12px #ffe000;}

.link-dot{
  width:5px;height:5px;background:#ffe000;
  box-shadow:0 0 6px #ffe000;flex-shrink:0;
  transition:box-shadow 0.3s ease;
}
.link-url{font-size:11px;color:#555;font-weight:400;margin-left:auto;}
.link-arrow{
  color:#ffe000;font-size:13px;opacity:0;
  transform:translateX(-4px);transition:all 0.15s ease;
}

.priv-row{
  display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:700;color:#666;
  padding:9px 0;border-bottom:1px solid #161611;
  transition:color 0.3s ease;
}
.priv-row.waking{color:#888;}
.priv-row .link-dot{background:#3a3a3a;box-shadow:none;}
.priv-desc{font-size:11px;color:#4a4a4a;font-weight:400;margin-left:auto;}

#muteBtn{
  position:fixed;bottom:80px;right:20px;z-index:50;
  background:none;border:none;color:#4a4318;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:0.15em;text-transform:uppercase;
  padding:6px;cursor:none;
  opacity:0;transition:opacity 0.3s ease,color 0.2s ease;
}
#muteBtn.show{opacity:1;}
#muteBtn:hover{color:#ffe000;}

#visualizer{
  position:fixed;bottom:0;left:0;width:100%;height:64px;
  z-index:5;display:flex;align-items:flex-end;
  pointer-events:none;opacity:0;transition:opacity 0.6s ease;
}
#visualizer.show{opacity:1;}
#visualizer .bar{
  flex:1 1 0;height:1px;background:#ffe000;
  opacity:0.5;margin:0 0.5px;
}

@media(max-width:480px){.link-url,.priv-desc{display:none;}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="bgcanvas"></canvas>
<canvas id="rippleCanvas"></canvas>

<div id="gate">
  <button id="enterBtn">click to enter</button>
</div>

<audio id="bgm" src="music.mp3" loop preload="none" crossorigin="anonymous"></audio>
<button id="muteBtn">mute</button>
<div id="visualizer"></div>

<main id="main">
  <div class="content">
    <div class="pfp-container">
      <div class="uname-wrapper">
        <div class="uname">B<span class="y">y</span>tez</div>
        <div class="utag">idk what to put here.</div>
      </div>
      <img src="pfp.png" alt="profile" class="pfp" id="pfpImg">
    </div>

    <div class="typeline" id="typeline"><span class="cursor"></span></div>

    <div class="section-tag">public</div>
    <div class="links">
      <a class="linkbtn" href="https://theke.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="link-dot"></span>Theke
        <span class="link-url">theke.vercel.app</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="linkbtn" href="https://bytezdev.itch.io/linuxce" target="_blank" rel="noopener noreferrer">
        <span class="link-dot"></span>LinuxCE
        <span class="link-url">itch.io</span>
        <span class="link-arrow">→</span>
      </a>
    </div>

    <div class="section-tag">private</div>
    <div class="links">
      <div class="priv-row"><span class="link-dot"></span>Lex<span class="priv-desc">mc client</span></div>
      <div class="priv-row"><span class="link-dot"></span>McBot<span class="priv-desc">mc automation</span></div>
      <div class="priv-row"><span class="link-dot"></span>Brother<span class="priv-desc">linux assistant</span></div>
    </div>
  </div>
</main>

<script>
const cursorEl = document.getElementById('cursor');
let mx = -999, my = -999;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursorEl.style.left = mx + 'px';
  cursorEl.style.top  = my + 'px';
});

document.querySelectorAll('a,button').forEach(el => {
  el.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
  el.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
});

const bgC = document.getElementById('bgcanvas');
const bgX = bgC.getContext('2d');
let W, H;

function resize(){
  W = bgC.width  = window.innerWidth;
  H = bgC.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function noise2(x, y, t){
  return (
    Math.sin(x * 0.008 + t * 0.3) *
    Math.cos(y * 0.011 + t * 0.2) +
    Math.sin(x * 0.015 - y * 0.009 + t * 0.15)
  ) * 0.5;
}

const PARTICLE_COUNT = 90;
let bgParticles = [];

function makeParticle(){
  return {
    x: Math.random() * (W || window.innerWidth),
    y: Math.random() * (H || window.innerHeight),
    vx: 0, vy: 0,
    maxLife: 200 + Math.random() * 400,
    age: 0,
    size: Math.random() * 1.4 + 0.3,
    hue: 42 + (Math.random() - 0.5) * 18
  };
}

for(let i = 0; i < PARTICLE_COUNT; i++) bgParticles.push(makeParticle());

let ripples = [];
function spawnRipple(x, y){
  ripples.push({ x, y, r: 0, maxR: 80 + Math.random() * 60, a: 0.5, speed: 1.5 + Math.random() });
}

let lastMx = 0, lastMy = 0;
let inkTrail = [];

document.addEventListener('mousemove', e => {
  const velX = e.clientX - lastMx;
  const velY = e.clientY - lastMy;
  lastMx = e.clientX; lastMy = e.clientY;

  if(Math.random() < 0.08) spawnRipple(e.clientX, e.clientY);

  const speed = Math.sqrt(velX*velX + velY*velY);
  if(speed > 1){
    inkTrail.push({
      x: e.clientX + (Math.random()-0.5)*4,
      y: e.clientY + (Math.random()-0.5)*4,
      vx: (Math.random()-0.5)*0.8,
      vy: (Math.random()-0.5)*0.8 - 0.2,
      a: Math.min(0.7, speed * 0.03),
      r: Math.random() * 2.5 + 0.5,
      life: 1
    });
  }
});

const ripC = document.getElementById('rippleCanvas');
const ripX = ripC.getContext('2d');

function resizeRip(){
  ripC.width  = window.innerWidth;
  ripC.height = window.innerHeight;
}
resizeRip();
window.addEventListener('resize', resizeRip);

let bgT = 0;
let audioEnergy = 0;
let animating = false;
let lastTime = 0;

function mainLoop(ts){
  requestAnimationFrame(mainLoop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if(!animating) return;

  bgT += dt;

  bgX.fillStyle = 'rgba(0,0,0,0.18)';
  bgX.fillRect(0, 0, W, H);

  for(let i = 0; i < 5; i++){
    const sx = Math.random() * W;
    const sy = Math.random() * H;
    const angle = noise2(sx, sy, bgT) * Math.PI * 2;
    bgX.beginPath();
    bgX.moveTo(sx, sy);
    bgX.lineTo(sx + Math.cos(angle)*12, sy + Math.sin(angle)*12);
    bgX.strokeStyle = 'rgba(255,224,0,0.015)';
    bgX.lineWidth = 1;
    bgX.stroke();
  }

  for(let p of bgParticles){
    const angle = noise2(p.x, p.y, bgT) * Math.PI * 2;
    const speed = 0.4 + audioEnergy * 0.8;

    const cdx = p.x - mx, cdy = p.y - my;
    const cdist = Math.sqrt(cdx*cdx + cdy*cdy);
    let cx = 0, cy = 0;
    if(cdist < 150 && cdist > 1){
      cx = (cdx/cdist) * (150 - cdist) * 0.006;
      cy = (cdy/cdist) * (150 - cdist) * 0.006;
    }

    p.vx = p.vx*0.85 + (Math.cos(angle)*speed*0.15 + cx);
    p.vy = p.vy*0.85 + (Math.sin(angle)*speed*0.15 + cy);
    p.x += p.vx; p.y += p.vy;
    p.age++;

    if(p.x<-5) p.x=W+5; if(p.x>W+5) p.x=-5;
    if(p.y<-5) p.y=H+5; if(p.y>H+5) p.y=-5;

    const life = 1 - (p.age / p.maxLife);
    if(life < 0){ Object.assign(p, makeParticle()); continue; }

    const pulse = 1 + audioEnergy * 0.6;
    bgX.beginPath();
    bgX.arc(p.x, p.y, p.size * pulse, 0, Math.PI*2);
    bgX.fillStyle = `hsla(${p.hue},100%,60%,${0.35*life})`;
    bgX.fill();
  }

  for(let i=0;i<bgParticles.length;i++){
    for(let j=i+1;j<bgParticles.length;j++){
      const dx=bgParticles[i].x-bgParticles[j].x,
            dy=bgParticles[i].y-bgParticles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){
        bgX.beginPath();
        bgX.moveTo(bgParticles[i].x,bgParticles[i].y);
        bgX.lineTo(bgParticles[j].x,bgParticles[j].y);
        bgX.strokeStyle=`rgba(255,224,0,${0.07*(1-d/110)*(1+audioEnergy)})`;
        bgX.lineWidth=0.8;
        bgX.stroke();
      }
    }
  }

  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    rp.r+=rp.speed; rp.a-=0.012;
    if(rp.a<=0){ripples.splice(i,1);continue;}
    bgX.beginPath();
    bgX.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
    bgX.strokeStyle=`rgba(255,224,0,${rp.a})`;
    bgX.lineWidth=0.8;
    bgX.stroke();
  }

  ripX.clearRect(0,0,ripC.width,ripC.height);
  for(let i=inkTrail.length-1;i>=0;i--){
    const ink=inkTrail[i];
    ink.x+=ink.vx; ink.y+=ink.vy;
    ink.life-=0.022;
    if(ink.life<=0){inkTrail.splice(i,1);continue;}
    ripX.beginPath();
    ripX.arc(ink.x,ink.y,ink.r,0,Math.PI*2);
    ripX.fillStyle=`rgba(255,224,0,${ink.a*ink.life})`;
    ripX.fill();
  }

  proximityCheck();
}

requestAnimationFrame(ts=>{lastTime=ts;requestAnimationFrame(mainLoop);});

function proximityCheck(){
  const pfp=document.getElementById('pfpImg');
  if(pfp){
    const r=pfp.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const d=Math.sqrt((mx-cx)**2+(my-cy)**2);
    pfp.classList.toggle('alive',d<140);
  }

  document.querySelectorAll('.linkbtn,.priv-row').forEach(el=>{
    const r=el.getBoundingClientRect();
    const nearX=Math.max(r.left,Math.min(mx,r.right));
    const nearY=Math.max(r.top, Math.min(my,r.bottom));
    const d=Math.sqrt((mx-nearX)**2+(my-nearY)**2);
    el.classList.toggle('waking',d>0&&d<60);
  });
}

const gate   =document.getElementById('gate');
const mainEl =document.getElementById('main');
const bgm    =document.getElementById('bgm');
const muteBtn=document.getElementById('muteBtn');
let muted=false;

gate.addEventListener('click',()=>{
  bgm.volume=0.4;
  bgm.play().catch(()=>{});
  gate.classList.add('hidden');
  mainEl.classList.add('show');
  muteBtn.classList.add('show');
  animating=true;
  setTimeout(()=>{gate.remove();startTyping();},600);
  initVisualizer();
  spawnRipple(mx,my);
});

muteBtn.addEventListener('click',e=>{
  e.stopPropagation();
  muted=!muted;
  bgm.muted=muted;
  muteBtn.textContent=muted?'unmute':'mute';
});

let audioCtx,analyser,freqData,barEls;
const BAR_COUNT=120;

function initVisualizer(){
  if(audioCtx)return;
  const vizEl=document.getElementById('visualizer');
  vizEl.classList.add('show');
  for(let i=0;i<BAR_COUNT;i++){
    const b=document.createElement('div');b.className='bar';
    vizEl.appendChild(b);
  }
  barEls=vizEl.querySelectorAll('.bar');
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaElementSource(bgm);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=0.82;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    drawBars();
  }catch(e){console.warn('audio ctx failed',e);}
}

function drawBars(){
  requestAnimationFrame(drawBars);
  if(!analyser)return;
  analyser.getByteFrequencyData(freqData);
  let sum=0;
  for(let v of freqData)sum+=v;
  audioEnergy=(sum/freqData.length)/128;
  for(let i=0;i<BAR_COUNT;i++){
    const idx=Math.floor((i/BAR_COUNT)*freqData.length*0.75);
    const v=freqData[idx]/255;
    barEls[i].style.height=Math.max(1,v*64)+'px';
  }
}

const lines=[
  "i code random shit.",
  "i play random shit.",
  "if i got an idea, i make it.",
  "idc how."
];
const typeEl=document.getElementById('typeline');

function startTyping(){
  let li=0,ci=0;
  const cursor='<span class="cursor"></span>';
  function typeChar(){
    if(li>=lines.length)li=0;
    const line=lines[li];
    if(ci<=line.length){
      typeEl.innerHTML=line.slice(0,ci)+cursor;
      ci++;setTimeout(typeChar,38);
    }else{setTimeout(eraseChar,1400);}
  }
  function eraseChar(){
    const line=lines[li];
    if(ci>=0){
      typeEl.innerHTML=line.slice(0,ci)+cursor;
      ci--;setTimeout(eraseChar,22);
    }else{li++;ci=0;setTimeout(typeChar,260);}
  }
  typeChar();
}

document.addEventListener('click',e=>{
  spawnRipple(e.clientX,e.clientY);
  for(let i=0;i<12;i++){
    inkTrail.push({
      x:e.clientX,y:e.clientY,
      vx:(Math.random()-0.5)*3,
      vy:(Math.random()-0.5)*3-0.5,
      a:0.6,r:Math.random()*3+1,life:1
    });
  }
});
</script>
</body>
</html>
